<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 06｜研究驗證框架｜AI 素養工作坊</title>
<link rel="stylesheet" href="assets/style.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="assets/shared.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const { SiteHeader, SiteFooter, ModuleHero, Block, ReflectionQuestions, PracticeNote, PracticeField, ModulePager } = window.SiteShared;

const GOALS = [
  "說明研究驗證在 AI 時代的重要性",
  "建立從來源、脈絡、比對到責任歸屬的基本驗證框架",
  "分辨第一手、第二手與 AI 彙整形成的第三手資料，並依資料層級決定查核與引用方式"
];

const QUESTIONS = [
  "你如何判斷自己看到的是第一手、第二手，還是經過多次轉述的第三手資料？",
  "如果內容看起來合理，但無法追溯來源，你會怎麼做？",
  "如果你沒有讀過原文，只看過別人的摘要，你在報告中可以怎麼誠實地表述？"
];

const VERDICTS = ["支持", "部分支持", "不支持", "目前無法判定"];

const CLAIM_FIELDS = [
  { key: "source", label: "原始來源與查核位置", hint: "作者、題名、頁碼或段落", rows: 2 },
  { key: "gap", label: "與 AI 轉述的差異", hint: "範圍、條件、語氣有沒有被改變？", rows: 2 },
  { key: "final", label: "最後採用的表述", hint: "你會怎麼寫進報告？", rows: 2 }
];

const emptyClaim = () => ({ claim: "", source: "", gap: "", verdict: "", final: "" });

function App() {
  const [answer, setAnswer] = useState({ level: "", context: "", compare: "", decision: "" });
  const set = (key) => (e) => setAnswer({ ...answer, [key]: e.target.value });
  const [claims, setClaims] = useState([emptyClaim(), emptyClaim()]);
  const [changed, setChanged] = useState("");
  const setClaim = (i, key) => (e) => {
    const next = claims.slice();
    next[i] = { ...next[i], [key]: e.target.value };
    setClaims(next);
  };

  return (
    <React.Fragment>
      <SiteHeader />
      <main className="page-shell">
        <ModuleHero
          id="06"
          type="內容展示＋練習題"
          title="研究驗證框架"
          intro="AI 能快速生成摘要、整理觀點，研究者更需要一套能持續使用的驗證框架：來源確認、脈絡確認、內容比對、責任確認。這一模組也會教學生分辨第一手、第二手、第三手資料。"
          goals={GOALS}
        />

        <Block title="核心收穫">
          <div className="callout">
            真正值得信任的內容，必須能被追溯、被比對、被放回脈絡，並且由研究者自己承擔最後的使用責任。
          </div>
        </Block>

        <Block title="練習一｜四步驟驗證">
          <PracticeNote />
          <p className="hint" style={{marginBottom:16}}>挑一段你打算引用的內容，依四步驟驗證：</p>
          <PracticeField
            label="① 這是第幾手資料？"
            rows={2}
            value={answer.level}
            onChange={set("level")}
          />
          <PracticeField
            label="② 放回原文脈絡後，它是在支持、限制、比較還是反駁某個主張？"
            rows={2}
            value={answer.context}
            onChange={set("context")}
          />
          <PracticeField
            label="③ 有沒有其他來源可以比對？"
            rows={2}
            value={answer.compare}
            onChange={set("compare")}
          />
          <PracticeField
            label="④ 你決定怎麼使用它，為什麼？"
            rows={3}
            value={answer.decision}
            onChange={set("decision")}
          />
        </Block>

        <Block title="練習二｜主張層級驗證：從「我有查核」到別人可以重建">
          <PracticeNote />
          <p className="hint" style={{margin:"12px 0 12px"}}>
            OUP 2026 年的調查中，許多研究者表示自己會查核 AI 產出，但這是自我報告（Oxford University Press, 2026）。「我有查核」要變成別人也能重建的紀錄，才算真正完成驗證。
          </p>
          <p className="hint" style={{marginBottom:16}}>
            請拿一段 AI 摘要，挑出兩個主張逐一查核，並用 Module 04 的四種標記判定。這不是新的驗證步驟，而是把來源確認、脈絡確認、內容比對與責任確認落實到每一個主張上。
          </p>
          {claims.map((c, i) => (
            <div className="stage-card" style={{textAlign:"left",marginBottom:16}} key={i}>
              <span className="stage-card__badge">{i + 1}</span>
              <PracticeField
                label={"主張 " + (i + 1)}
                hint="把 AI 摘要中的一句話改寫成可以查核的主張"
                rows={2}
                value={c.claim}
                onChange={setClaim(i, "claim")}
              />
              {CLAIM_FIELDS.slice(0, 2).map((f) => (
                <PracticeField key={f.key} label={f.label} hint={f.hint} rows={f.rows} value={c[f.key]} onChange={setClaim(i, f.key)} />
              ))}
              <div style={{marginBottom:18}}>
                <p style={{fontWeight:600,fontSize:14,marginBottom:8}}>判定</p>
                <div style={{display:"flex",flexWrap:"wrap",gap:"8px 18px",fontSize:14}}>
                  {VERDICTS.map((v) => (
                    <label key={v} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
                      <input type="radio" name={"verdict-" + i} value={v} checked={c.verdict === v} onChange={setClaim(i, "verdict")} style={{width:"auto"}} />
                      {v}
                    </label>
                  ))}
                </div>
              </div>
              {CLAIM_FIELDS.slice(2).map((f) => (
                <PracticeField key={f.key} label={f.label} hint={f.hint} rows={f.rows} value={c[f.key]} onChange={setClaim(i, f.key)} />
              ))}
            </div>
          ))}
          <PracticeField
            label="哪一項證據改變了你原本的寫法？"
            hint="這個決定由誰作出、依據是什麼？"
            rows={3}
            value={changed}
            onChange={(e) => setChanged(e.target.value)}
          />
        </Block>

        <Block title="討論／反思題">
          <ReflectionQuestions questions={QUESTIONS} />
        </Block>

        <Block title="參考資料">
          <div className="citation-box">
            Oxford University Press. (2026, September). <em>Disclosing AI use in academic research: Survey findings</em> [Survey report].
          </div>
        </Block>

        <ModulePager currentId="06" />
      </main>
      <SiteFooter />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
