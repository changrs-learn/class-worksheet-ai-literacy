          </div>
        </Block>

        <Block title="練習一｜ROBOT test 小測驗">
          <div className="callout callout--muted" style={{marginBottom:20}}>
            <p style={{marginBottom:10}}>
              <strong>ROBOT test 有新舊兩個版本，字母拼法一樣，但評估對象不同：</strong>原始版由 Hervieux 與 Wheatley 於 2020 年提出，用來評估「要不要使用這個 AI 工具」；
              但生成式 AI 普及後，同一個工具每次產出的內容都可能不一樣，只評估工具已經不夠，因此 2025 年出現了轉向評估「這段 AI 產出的內容能不能用」的新版（Data Edge Pro, 2025）。
              R 和 B 兩個字母意思接近，但 O 和 T 的意思改變了——下面練習用的是<strong>新版（評估內容）</strong>，跟 Module 07 的學習目標「以 ROBOT test 檢視 AI 生成內容」對應。
            </p>
            <div className="matrix-scroll">
              <table className="matrix-table">
                <thead>
                  <tr>
                    <th></th>
                    <th>原始版（2020）｜評估 AI 工具</th>
                    <th>新版（2025）｜評估 AI 生成內容</th>
                  </tr>
                </thead>
                <tbody>
                  {ROBOT_VERSIONS.map((v, i) => (
                    <tr key={i}>
                      <td className="matrix-row-label matrix-row-label--help">{v.code}</td>
                      <td>{v.oldName}<br/><span className="hint">{v.oldDesc}</span></td>
                      <td>{v.newName}<br/><span className="hint">{v.newDesc}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <PracticeNote text="練習用，僅供自我檢視，不會送出或儲存" />
          <p className="hint" style={{marginBottom:14}}>請先讀下面這段「AI 生成的文獻摘要示例」，再依新版 R-O-B-O-T 五個面向逐一檢視，寫下你的判斷。</p>

          <div className="callout callout--muted" style={{marginBottom:20}}>
            <p style={{fontWeight:600,marginBottom:8,color:"var(--text)"}}>練習用示例（虛構文字，非真實文獻摘要）</p>
            <p>「根據多篇研究，AI 影像辨識技術能夠準確判斷超過 95% 的作物病害種類，已經證實可以取代傳統田間巡查，全球農業已經全面採用這項技術。這項技術主要由歐美研究團隊開發，目前是農業科技的共識做法，能大幅降低農藥使用量。相關研究成果最早可追溯至 2018 年的一篇論文，至今仍是該領域最重要的參考依據。」</p>
          </div>

          {ROBOT_LETTERS.map((r, i) => (
            <PracticeField
              key={i}
              label={<span><span className="q-badge">{r.letter}</span>{r.name} — {r.question}</span>}
              rows={2}
              value={robot[i]}
              onChange={setRobotAt(i)}
            />
          ))}

          <PracticeField
            label="貫穿提醒：如果這段內容錯了，誰會受到影響？錯誤的後果有多大？是否需要請教領域專家？"
            rows={2}
            value={robotImpact}
            onChange={(e) => setRobotImpact(e.target.value)}
          />
        </Block>

        <Block title="練習二｜AI 揭露決策卡（六格）">
          <PracticeNote text="請選一個你正在進行的研究報告、專題或學位論文來練習填寫" />
          <div className="module-grid" style={{padding:0,margin:0,marginTop:14}}>
            {DECISION_CARD.map((q, i) => (
              <div className="stage-card" style={{textAlign:"left"}} key={i}>
                <span className="stage-card__badge">{i + 1}</span>
                <p style={{fontSize:14,fontWeight:600,marginBottom:10,lineHeight:1.6}}>{q}</p>
                <textarea rows={3} value={card[i]} onChange={setCardAt(i)} placeholder="請輸入你的答案..." />
              </div>
            ))}
          </div>
          <div className="callout callout--muted" style={{marginTop:16}}>
            第 4 格提到「查了哪些課程、系所、學校、期刊或出版社規範」——如果你是臺大學生，可以參考
            <a href="resources.html" style={{color:"var(--ink)",fontWeight:600}}> 臺大 AI 政策速查表 →</a>，
            裡面整理了校級研究誠信、校級教學框架、院系所自訂規範、學術出版倫理與圖書館引用支援共五層的實際案例與連結。
          </div>
        </Block>

        <Block title="案例｜多人合作研究中的文字修訂、圖像製作與 AI 揭露">
          <p style={{marginBottom:14}}>
            三位研究者共同撰寫一篇準備投稿的論文：甲負責研究設計與方法，乙負責資料整理與分析，丙負責文字修訂與圖像製作。丙用生成式 AI 產生一張研究概念圖，再用另一個圖像工具修改配色、版面與部分視覺元素，也用文字型 AI 協助修訂英文句子。丙把圖放進稿件，但只在作者群內口頭說明，沒有記錄工具名稱、版本、提示詞、修改過程或素材來源；作者群也還沒查目標出版社對生成式圖像、AI 輔助寫作與圖說揭露的最新規範。
          </p>
          <p style={{fontWeight:600,fontSize:14,marginBottom:10}}>請依四個步驟判斷：</p>
          <ol style={{paddingLeft:22,fontSize:14,lineHeight:1.8,marginBottom:14}}>
            {CASE6_STEPS.map((t, i) => <li key={i} style={{marginBottom:6}}>{t}</li>)}
          </ol>
          <div className="callout callout--muted">
            這個案例沒有預設「用 AI 圖像就一定違規」。是否違規，取決於目標出版社的政策、圖像用途、揭露是否完整、作者是否實質查核與修訂，以及素材與輸出的權利基礎。即使出版社允許，也不能省略圖說揭露、紀錄保存與人類作者的最終責任。
          </div>
        </Block>

        <Block title="練習三｜AIxCRediT 延伸卡">
          <PracticeNote text="接續練習二的六格決策卡，適合正在寫論文或準備投稿的同學" />
          <p className="hint" style={{margin:"12px 0 14px"}}>
            《教育資料與圖書館學》（JoEMLS）要求作者提交 AIxCRediT Statement 表單，把三件事分開說明：用 <strong>CRediT</strong> 交代每位人類作者的研究貢獻，用 <strong>AIDAT</strong> 交代 AI 協助的類型，再用 <strong>L0–L4</strong> 呈現作者監督、查核與修訂的深度。這是該刊的制度實例，不是所有期刊的通用格式，但它說明了為什麼「AI 沒有列為作者」不等於「不需要揭露 AI 使用」。
          </p>

          <div className="principle-grid" style={{marginBottom:18}}>
            <div className="principle-item">
              <p className="principle-item__title">CRediT｜14 種人類貢獻角色</p>
              <p className="principle-item__desc">{CREDIT_ROLES.join("、")}</p>
            </div>
            <div className="principle-item">
              <p className="principle-item__title">AIDAT｜9 類 AI 協助類型</p>
              <p className="principle-item__desc">{AIDAT_TYPES.join("、")}</p>
            </div>
          </div>

          {EXTENSION_FIELDS.slice(0, 3).map((f) => (
            <PracticeField key={f.key} label={f.label} hint={f.hint} rows={f.rows} value={ext[f.key]} onChange={setExtField(f.key)} />
          ))}

          <div style={{marginBottom:18}}>
            <p style={{fontWeight:600,fontSize:14,marginBottom:8}}>AI 與作者參與程度（L0–L4）<span className="hint"> — 選一個最接近的程度</span></p>
            {AI_LEVELS.map((l) => (
              <label key={l.code} style={{display:"flex",alignItems:"flex-start",gap:8,fontSize:14,marginBottom:6,cursor:"pointer"}}>
                <input type="radio" name="ai-level" value={l.code} checked={ext.level === l.code} onChange={setExtField("level")} style={{width:"auto",marginTop:4}} />
                <span><strong>{l.code} {l.name}</strong><span className="hint"> — {l.desc}</span></span>
              </label>
            ))}
          </div>

          {EXTENSION_FIELDS.slice(3).map((f) => (
            <PracticeField key={f.key} label={f.label} hint={f.hint} rows={f.rows} value={ext[f.key]} onChange={setExtField(f.key)} />
          ))}

          <div className="callout callout--muted" style={{marginTop:4}}>
            完成後，請把你參考的政策來源分成「正式規範」、「可參考範例」與「個人意見」三類。社群問答或學長姐的做法只能當作參考，不能取代正式規範。ROBOT 警訊請回到練習一檢查。
          </div>
        </Block>

        <Block title="延伸參考｜出版社 AI 揭露政策比較">
          <p className="hint" style={{marginBottom:14}}>
            投稿前政策差異本身就是重點：不是哪一家最嚴格，而是各家如何界定作者責任、揭露位置與查核要求。下表是教學用的政策識讀表，不是完整政策轉錄，實際投稿仍須查目標期刊最新規定。
          </p>
          <div className="matrix-scroll">
            <table className="matrix-table" style={{minWidth:760}}>
              <thead>
                <tr>
                  <th>政策案例</th>
                  <th>內容性質</th>
                  <th>可觀察的責任要求</th>
                  <th>教學提醒</th>
                </tr>
              </thead>
              <tbody>
                {PUBLISHER_POLICIES.map((p, i) => (
                  <tr key={i}>
                    <td style={{fontWeight:600}}>{p.name}</td>
                    <td>{p.nature}</td>
                    <td>{p.require}</td>
                    <td>{p.tip}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="citation-box" style={{marginTop:14}}>
            出版社與期刊的 AI 政策更新速度很快，內容常在數月內修訂。上表僅為教學用的整理時點快照，正式投稿或引用前，務必回到該出版社／期刊當下的官方頁面，以其最新公告的原文為準。
          </div>
        </Block>

        <Block title="討論／反思題">
          <ReflectionQuestions questions={QUESTIONS} />
        </Block>

        <ModulePager currentId="07" />
      </main>
      <SiteFooter />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
